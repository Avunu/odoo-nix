version: 2

# Commit prefixes (docs/development/upgrading.md, "Releases"): `fix(deps)`, so each bump ships as an
# odoo-nix patch release. The flake inputs are what a project builds Odoo from,
# and frappe-nix gives its own nix, pre-commit and github-actions bumps the same
# prefix.
#
# Every ecosystem waits seven days after a release before proposing it
# (python-devops-nix docs/conventions.md, Dependabot), so a version that is pulled or
# patched within the week never reaches a pull request. Security updates are not
# held back.
#
# Keeps this repo's dependencies up to date. PRs, action bumps and the OCB pins included,
# auto-merge once the required checks go green and are kept up to date with main — see
# .github/workflows/dependabot-auto-merge.yml.
#
# Deliberately NOT configured: templates/project/pyproject.toml. It is a scaffolding
# template, not a resolvable project — its @PLACEHOLDER@ tokens (requires-python,
# project name) are substituted by `odoo-init`, and both the install set and
# [tool.uv.sources] are generated from modules.txt by lib/oca_sources.py, so a uv/pip
# updater has nothing valid to resolve and would fight the generator. Generated projects
# carry their own uv.lock, updated via `odoo-update`.
updates:
  # Nix flake inputs — nixpkgs, flake-parts, devenv, nix2container, pyproject-nix,
  # uv2nix, pyproject-build-systems. This is the real dependency set for this repo.
  # Dependabot reads flake.lock directly (schema v7).
  #
  # Weekly, not daily: nixpkgs tracks nixos-unstable and moves constantly, so a daily
  # bump would be pure churn.
  #
  # Grouped into one PR on purpose. uv2nix and pyproject-build-systems both `follows`
  # pyproject-nix and nixpkgs; bumping them through separate PRs can land a lock where
  # the followed and following inputs disagree. One PR keeps the graph consistent.
  #
  # The OCB pins (ocb-18, ocb-19, ocb-20 -- the source trees the test suite builds) get their
  # own PR. A bump there is really "OCB moved; does odoo-nix still build it?", answered
  # by `nix flake check` on that PR, and it can legitimately go red: when OCB's
  # setup.py install_requires changed, `lock-fresh-<major>` fails and prints the fix
  # (`nix run .#relock-fixtures`, commit tests/fixtures/*/uv.lock onto the branch). Keeping it
  # separate means an OCB-driven red never parks the nixpkgs/uv2nix bump. It auto-merges
  # like the rest (.github/workflows/dependabot-auto-merge.yml) once the required `flake`
  # is green; a red one waits for the relock.
  #
  # odoo-ls-src / odoo-ls-typeshed (the language server, lib/odoo-ls.nix) get their own
  # PR for the same reason: a bump needs `nix run .#relock-odoo-ls` (odoo-ls does not
  # commit a Cargo.lock upstream) before `nix build .#odoo-ls` goes green again.
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
    # OCB merges odoo/odoo in every night, and the cooldown picks the newest commit older
    # than its window by date, which is almost always an odoo/odoo commit inside such a
    # merge. Those have no OCB pyproject.toml, so every check that evaluates the Python
    # environment fails with "path .../pyproject.toml does not exist" (#63, #140). Dependabot
    # applies a 3-day cooldown even when none is configured, so the OCB pins must be excluded.
    cooldown:
      default-days: 7
      exclude: ["ocb-*"]
    commit-message:
      prefix: "fix(deps)"
    # python-devops-nix is standards-core too: its lock node moves with the
    # standards-core URL and the actions' SHAs, all at once (`nix run .#bump-base`;
    # checks.standards-core-pins fails a lone bump).
    ignore:
      - dependency-name: python-devops-nix
    groups:
      ocb:
        patterns: ["ocb-*"]
      odoo-ls:
        patterns: ["odoo-ls-*"]
      nix:
        patterns: ["*"]

  # The hook revs in .pre-commit-config.yaml (pre-commit-hooks, ruff-pre-commit),
  # in one PR.
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "fix(deps)"
    groups:
      pre-commit-hooks:
        patterns: ["*"]

  # GitHub Actions used by the workflows in .github/workflows. python-devops-nix's
  # actions and reusable workflows move with its other pins (`nix run .#bump-base`).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    commit-message:
      prefix: "fix(deps)"
    ignore:
      - dependency-name: "Avunu/python-devops-nix*"
    groups:
      github-actions:
        patterns: ["*"]

  # odoo-nix-tools' dev lock (py/odoo_nix_tools/uv.lock), which its suites run from
  # without Nix (`uv run python -m unittest discover -s tests`). Development only:
  # the package build and `uv tool install` never read it. standards-core moves with
  # every other python-devops-nix pin (`nix run .#bump-base`), never on its own.
  - package-ecosystem: uv
    directory: /py/odoo_nix_tools
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: standards-core
    groups:
      odoo-nix-tools-dev:
        patterns: ["*"]
