version: 2

# Keeps this repo's dependencies up to date. PRs auto-merge once the required checks go
# green — see .github/workflows/dependabot-auto-merge.yml.
#
# Deliberately NOT configured: templates/project/pyproject.toml. It is a scaffolding
# template, not a resolvable project — its @PLACEHOLDER@ tokens (requires-python,
# project name) are substituted by `odoo-init`, and both the install set and
# [tool.uv.sources] are generated from modules.txt by lib/oca_sources.py, so a uv/pip
# updater has nothing valid to resolve and would fight the generator. Generated projects
# carry their own uv.lock, updated via `odoo-update`.
updates:
  # Nix flake inputs — nixpkgs, flake-parts, devenv, nix2container, pyproject-nix,
  # uv2nix, pyproject-build-systems. This is the real dependency set for this repo.
  # Dependabot reads flake.lock directly (schema v7).
  #
  # Weekly, not daily: nixpkgs tracks nixos-unstable and moves constantly, so a daily
  # bump would be pure churn.
  #
  # Grouped into one PR on purpose. uv2nix and pyproject-build-systems both `follows`
  # pyproject-nix and nixpkgs; bumping them through separate PRs can land a lock where
  # the followed and following inputs disagree. One PR keeps the graph consistent.
  #
  # The OCB pins (ocb-18, ocb-19 -- the source trees the test suite builds) get their
  # own PR. A bump there is really "OCB moved; does odoo-nix still build it?", answered
  # by `nix flake check` on that PR, and it can legitimately go red: when OCB's
  # setup.py install_requires changed, `lock-fresh-<major>` fails and prints the fix
  # (`nix run .#relock`, commit tests/fixtures/*/uv.lock onto the branch). Keeping it
  # separate means an OCB-driven red never parks the nixpkgs/uv2nix bump.
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      ocb:
        patterns: ["ocb-*"]
      nix:
        patterns: ["*"]

  # GitHub Actions used by the workflows in .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: chore
    groups:
      github-actions:
        patterns: ["*"]
