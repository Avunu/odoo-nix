name: odoo-test

# The `test` gate of a repository on odoo-nix's standards (py/odoo_nix_tools/DESIGN.md
# §6.1.2, §6.4), reusable: the caller's job is named `ci`, so the check reads `ci / test`.
#
# The tests need the code, so the checkout has the submodules, fetched with the CI App's
# token when the caller passes one (ci.github-app: an App installed on every private
# submodule's repository), else with GITHUB_TOKEN (public submodules only). Then
# `ODOO_NIX_CI=1 nix develop --no-pure-eval -c odoo-nix gate test` runs the addons' tests
# on a fresh database of a throwaway PostgreSQL cluster, with coverage and checklog-odoo.

on:
  workflow_call:
    inputs:
      integration-branch:
        description: the checkout's integration branch
        type: string
        default: develop
      runs-on:
        description: >-
          The runner, as JSON: a label or a list of labels (`["self-hosted", "nixos"]`). A pull
          request from a fork always runs on ubuntu-latest.
        type: string
        default: '["ubuntu-latest"]'
      test-timeout-minutes:
        description: ci.test-timeout-minutes
        type: number
        default: 60
      client-id:
        description: "ci.github-app: the CI App's client ID (an Actions variable); empty for none"
        type: string
        default: ""
    secrets:
      APP_PRIVATE_KEY:
        description: "ci.github-app: the CI App's private key (PEM)"
        required: false

permissions: {}

env:
  FORCE_COLOR: "1"

jobs:
  test:
    name: test
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON(inputs.runs-on) }}
    timeout-minutes: ${{ inputs.test-timeout-minutes }}
    permissions:
      contents: read # the checkout
    steps:
      # A self-hosted runner reuses $RUNNER_TEMP and the workspace, and an interrupted job leaves
      # read-only files there (copies out of the Nix store) that the runner's cleanup and checkout
      # cannot remove: clear $RUNNER_TEMP, keeping the runner's _* files, and make the workspace
      # writable for checkout to clean. The working directory is $RUNNER_TEMP, which always exists.
      - if: runner.environment != 'github-hosted'
        name: Clear what an earlier job left in the runner's temp dir and workspace
        working-directory: ${{ runner.temp }}
        run: |
          find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 ! -name '_*' ! -type l -exec chmod -R u+w {} +
          find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 ! -name '_*' -exec rm -rf {} +
          if [ -d "$GITHUB_WORKSPACE" ]; then
            find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 ! -type l -exec chmod -R u+w {} +
          fi

      # A project's flake takes more than a GitHub-hosted runner has free: Nix clones each
      # submodule's full history itself (OCB's alone is many GiB), then builds the shell.
      - if: runner.environment == 'github-hosted'
        name: Free disk space on the GitHub-hosted runner
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: app
        name: Whether the caller passes the CI App
        env:
          ENABLED: ${{ inputs.client-id != '' && secrets.APP_PRIVATE_KEY != '' }}
        run: echo "enabled=$ENABLED" >> "$GITHUB_OUTPUT"

      # The token reads this repository and the owner's repositories its submodules name
      # (a private one: odoo-studio for a client project), no other.
      - if: steps.app.outputs.enabled == 'true'
        id: repos
        name: The owner's repositories the submodules name
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          repos="$REPO"
          if [ -f .gitmodules ]; then
            while read -r _ url; do
              if [[ "${url,,}" =~ ^(https://|git@)github\.com[:/]${OWNER,,}/([^/]+)$ ]]; then
                repos="$repos,${BASH_REMATCH[2]%.git}"
              fi
            done < <(git config --file .gitmodules --get-regexp '^submodule\..*\.url$')
          fi
          echo "repositories=$repos" >> "$GITHUB_OUTPUT"

      - if: steps.app.outputs.enabled == 'true'
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.client-id }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: ${{ steps.repos.outputs.repositories }}
          permission-contents: read

      # Through a header given to this step's git commands only (nothing is written to
      # .git/config).
      - name: The submodules
        env:
          TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          set -euo pipefail
          GIT_CONFIG_COUNT=1
          GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          export GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          echo "::add-mask::$GIT_CONFIG_VALUE_0"
          git submodule sync --recursive
          # A hosted runner starts empty each time and only needs the files: history here would
          # sit beside the copy Nix clones. A self-hosted runner keeps its clones between jobs.
          depth=()
          if [ "$RUNNER_ENVIRONMENT" = github-hosted ]; then
            depth=(--depth 1)
          fi
          git submodule update --init --recursive --force "${depth[@]}"

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        if: runner.environment == 'github-hosted'
        with:
          determinate: false

      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        if: runner.environment == 'github-hosted'
        with:
          diagnostic-endpoint: ""
          use-flakehub: false

      # The shell's ports are a base plus an offset hashed from the project's name (python-devops-nix
      # docs/conventions.md, Ports), so every job of one project asks for the same ones. Jobs that
      # run side by side on one self-hosted host (a Dependabot burst opens a pull request each) then
      # meet on them: the second Odoo dies with "Port 10315 is in use by another program" before
      # one test has run. So each job picks an offset of its own, which the shell reads from
      # ODOO_NIX_PORT_OFFSET: a hash of the run, attempt and runner, as the place to start, then the
      # first offset from there whose five ports nothing on the host holds. Two jobs choosing in the
      # same moment can still agree, but only when their hashes do (1 in 900); a GitHub-hosted
      # runner is alone on its machine and finds its start free.
      - if: env.ODOO_NIX_PORT_OFFSET == ''
        name: A port offset no other job on this host holds
        env:
          SEED: ${{ github.repository }}/${{ github.run_id }}/${{ github.run_attempt }}/${{ runner.name }}
        run: |
          set -euo pipefail
          # modules/devenv.nix, odoo-nix.ports bases: http, gevent, db, smtp, mailUi.
          bases=(10000 11000 12000 13000 14000)

          # Whether something listens on the port, or a throwaway PostgreSQL cluster's socket
          # (<tmp>/odoo-nix-pg-*/.s.PGSQL.<port>) carries it: that one is a file, not a listener.
          in_use() {
            (exec 3<>"/dev/tcp/127.0.0.1/$1") 2>/dev/null && return 0
            compgen -G "${TMPDIR:-/tmp}/odoo-nix-pg-*/.s.PGSQL.$1" >/dev/null && return 0
            compgen -G "/tmp/odoo-nix-pg-*/.s.PGSQL.$1" >/dev/null && return 0
            return 1
          }

          start=$(( 16#$(printf '%s' "$SEED" | sha256sum | cut -c1-4) % 900 ))
          for ((i = 0; i < 900; i++)); do
            offset=$(( (start + i) % 900 ))
            free=1
            for base in "${bases[@]}"; do
              if in_use $(( base + offset )); then
                free=0
                break
              fi
            done
            if [ "$free" = 1 ]; then
              echo "ODOO_NIX_PORT_OFFSET=$offset" >> "$GITHUB_ENV"
              echo "port offset $offset (http $(( bases[0] + offset ))), starting from $start"
              exit 0
            fi
          done
          echo "::error::every port offset from 0 to 899 has a port in use on this host"
          exit 1

      - name: odoo-nix gate test
        env:
          ODOO_NIX_CI: "1"
        run: nix develop --no-pure-eval -c odoo-nix gate test --format github

      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-test
          path: |
            .odoo-nix/gate/test.json
            .odoo-nix/test/odoo.log
            .odoo-nix/coverage/coverage.xml
          if-no-files-found: ignore
