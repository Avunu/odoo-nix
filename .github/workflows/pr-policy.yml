name: pr-policy

# odoo-nix's pr-policy check (lib/pr_policy.py; README "Versioning"): the base is
# main, and the title and every commit pass `committed` (committed.toml) and
# refuse `!` and BREAKING CHANGE, because an odoo-nix major release is a
# deliberate `Release-As: <N>.0.0` footer.
#
# Its own file, not a check.yml job, so a retitle (`edited`) re-runs this alone
# and never rebuilds `flake`. release.yml dispatches it on the release pull
# request, whose GITHUB_TOKEN push raises no event.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pr-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-policy:
    name: pr-policy
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","nixos"]') }}
    timeout-minutes: 5
    permissions:
      contents: read # the checkout
      pull-requests: read # the PR's title and base (a dispatch looks the PR up)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      # committed's version is nixpkgs' (checks.pr-policy runs the same tests with it).
      - name: Install committed
        run: uv tool install --python 3.14 committed==1.1.11

      - name: lib/pr_policy.py
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REF_NAME: ${{ github.ref_name }}
        run: python3 -I lib/pr_policy.py --base-branch main
