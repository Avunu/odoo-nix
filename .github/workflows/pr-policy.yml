name: pr-policy

# odoo-nix's pr-policy check (docs/reference/layout.md, "What CI runs"):
# `odoo-nix policy --pr --major-free`, the standards core's policy with no version
# scheme: the base is main, and the title and every commit pass `committed`
# (committed.toml) and refuse `!` and BREAKING CHANGE, because an odoo-nix major
# release is a deliberate `Release-As: <N>.0.0` footer. Dependabot's pull requests
# skip committed's subject length only (their titles name SHA pins).
#
# Its own file, not a check.yml job, so a retitle (`edited`) re-runs this alone
# and never rebuilds `flake`. release.yml dispatches it on the release pull
# request, whose GITHUB_TOKEN push raises no event.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pr-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-policy:
    name: pr-policy
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","nixos"]') }}
    timeout-minutes: 30
    permissions:
      contents: read # the checkout
      pull-requests: read # the PR's title and base (a dispatch looks the PR up)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        if: runner.environment == 'github-hosted'
        with:
          determinate: false

      # This tree's odoo-nix (packages.odoo-nix) and the engine's committed
      # (packages.committed, nixpkgs'), the ones the standards' pr-policy runs.
      - name: odoo-nix and committed
        run: |
          set -euo pipefail
          for package in odoo-nix committed; do
            echo "$(nix build --no-link --print-out-paths ".#$package")/bin" >> "$GITHUB_PATH"
          done

      - name: odoo-nix policy --pr --major-free
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REF_NAME: ${{ github.ref_name }}
        run: odoo-nix policy --pr --major-free --base-branch main
