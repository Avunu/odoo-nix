name: Dependabot auto-merge

# Dependabot pull requests, through python-devops-nix's reusable workflows (its
# docs/conventions.md, CI). The nix and pre-commit ones auto-merge, whatever their update
# type, the OCB pins included. GitHub merges once the branch is mergeable and every
# *required* status check passes, so auto-merge is only as safe as the checks marked
# required on `main` (check.yml's `flake` and pr-policy); a pull request whose checks fail
# stays open.
#
# Two ecosystems are reviewed by a person instead (exclude-ecosystems), because what they
# move runs where the org App's key can be read:
#   • github_actions: every action pinned in .github/workflows runs here or, through the
#     reusable workflows (odoo-release, odoo-release-please, odoo-deps), in a product's job
#     that holds the key (checkout, download-artifact, create-github-app-token,
#     release-please-action, and through python-devops-nix's actions setup-uv and
#     fetch-metadata). The reusable workflow's `diff` job also holds any pull request whose
#     diff touches a workflow or an action file.
#   • uv: py/odoo_nix_tools/uv.lock is what standards-install's `hardened` mode installs,
#     by hash, in every product job that holds the key.
# review-dependencies names the actions those jobs run today, so `diff` holds a bump of one
# even if Dependabot files it under another ecosystem.
#
# The OCB pins (the `ocb` group, dependabot/nix/ocb-*) were once reviewed by a person: a
# bump can legitimately go red and need `nix run .#relock-fixtures` (.github/dependabot.yml),
# and the one in #63 merged before its `flake` check failed, when nothing was required on
# `main`. `flake` is required now, so a red OCB bump stays open until someone commits the
# relock onto it, and a green one merges.
#
# update-branches brings each Dependabot pull request that falls behind `main` up to date,
# after each push to `main` and daily, through the update-branch API (Dependabot ignores
# `@dependabot rebase` from a bot).
#
# The org's GitHub App (the variable AVUNU_CI_APP_ID, or a Dependabot secret of that name,
# and the secret AVUNU_CI_PRIVATE_KEY) enables auto-merge and updates the branches, so a
# merge raises a push that starts check.yml and release.yml on `main`, and an updated branch
# starts its checks. Without it, GITHUB_TOKEN, and check.yml and pr-policy.yml are
# dispatched on an updated branch.
#
# Requires (one-time, in repo settings):
#   • Settings → General → Pull Requests → "Allow auto-merge"
#   • Settings → Branches → protect `main`, require the checks a merge must wait for
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  auto-merge:
    # The PR's author, not github.actor (which a re-run by a person changes).
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write # gh pr merge --auto
      pull-requests: write # gh pr merge --auto
    uses: Avunu/python-devops-nix/.github/workflows/dependabot-auto-merge.yml@fbc892b633b947031426e1fa43d45dd9ae462c33 # python-devops-nix#72 head, until it merges
    with:
      exclude-ecosystems: github_actions uv
      review-dependencies: >-
        actions/create-github-app-token actions/checkout actions/download-artifact
        astral-sh/setup-uv dependabot/fetch-metadata googleapis/release-please-action
    # A Dependabot run sees only Dependabot secrets: the App's ID may be one too.
    secrets:
      APP_ID: ${{ vars.AVUNU_CI_APP_ID || secrets.AVUNU_CI_APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.AVUNU_CI_PRIVATE_KEY }}

  update-branches:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write # update-branch without the App
      pull-requests: write # update-branch
      actions: write # without the App, dispatch the required checks on the new head
    uses: Avunu/python-devops-nix/.github/workflows/dependabot-update-branches.yml@fbc892b633b947031426e1fa43d45dd9ae462c33 # python-devops-nix#72 head, until it merges
    with:
      dispatch: check.yml pr-policy.yml
    secrets:
      APP_ID: ${{ vars.AVUNU_CI_APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.AVUNU_CI_PRIVATE_KEY }}
