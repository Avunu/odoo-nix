name: check

# Everything this repo asserts about itself: `flake` through the flake, so that CI and
# a laptop measure the same tree, and `lint`, every prek hook with no nix. This is what
# you mark required on `main`: auto-merge (Dependabot PRs) is only as safe as what runs here.
#
#   addons-*, odoo-conf-*        pure tests of lib/addons.nix + lib/odoo-conf.nix
#   lock-fresh-<18|19|20>        tests/fixtures/<series>/uv.lock matches the pinned OCB
#   built-odoo-<18|19|20>        a real Odoo assembled from the pin with the consumer code path
#   odoo-init-<18|19|20>         `-i base` against an in-sandbox PostgreSQL
#   odoo-test-<18|19|20>         the fixture addon's Odoo tests (incl. the devguard mail guard)
#   nginx                        the NixOS module's nginx/socket contract (stub Odoo, KVM)
#   service-<18|19|20>           the NixOS module bringing up the real Odoo (KVM)
#
# A failed `flake` uploads the failed derivations and the end of their logs, and `report`
# comments them, with every job's result, on the pull request (python-devops-nix's
# nix-failures and check-report actions). A passing run only edits an earlier comment.
#
# OCB is pinned (inputs.ocb-18 / ocb-19 / ocb-20, flake = false). Nothing drifts except when
# flake.lock changes, and dependabot's weekly nix update is what proposes that -- as a
# pull request that runs these checks. So there is no `schedule:` here; its absence is
# the point. release.yml dispatches this on the release pull request, whose
# GITHUB_TOKEN push raises no event.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  # Every hook in .pre-commit-config.yaml over the whole tree, run by prek: the command
  # a developer's commit runs, with no nix involved.
  lint:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","nixos"]') }}
    permissions:
      contents: read # the checkout
    steps:
      # A self-hosted runner reuses $RUNNER_TEMP, and its own cleanup leaves what an earlier
      # job made read-only (copies out of the Nix store): clear it, keeping the runner's _* files.
      - if: runner.environment != 'github-hosted'
        name: Clear what an earlier job left in the runner's temp dir
        working-directory: ${{ runner.temp }}
        run: |
          find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 ! -name '_*' ! -type l -exec chmod -R u+w {} +
          find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 ! -name '_*' -exec rm -rf {} +

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `prek run --all-files --show-diff-on-failure`: a hook that rewrites a file fails the
      # job, so what merges is what the hooks would have left.
      - uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0

  flake:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","nixos"]') }}
    permissions:
      contents: read # the checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `determinate: false` -- this flake carries no Determinate-only nixConfig
      # (FlakeHub substituters, lazy trees), so the default buys nothing here and
      # just has determinate-nixd try to log into FlakeHub for a repo that isn't
      # registered there, logging a failure annotation on every run. `kvm` stays
      # at its default (on): the installer adds the udev rule so the daemon
      # advertises the `kvm` system feature the VM tests need.
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        if: runner.environment == 'github-hosted'
        with:
          determinate: false

      # Backs /nix/store with the GitHub Actions cache. cache.nixos.org serves the
      # nixpkgs half of the closure; what it cannot serve is what this run builds
      # itself -- the `odoo` wheels, the PyPI wheel unpacks, psycopg2/python-ldap
      # from sdist, the VM test closures -- and those are what this recovers
      # between runs (~1 GB compressed, well under the 10 GB cap). Fetched flake
      # inputs (the OCB tarballs) are not uploaded; GitHub serves them fast
      # enough, so `diff-store` stays off. Fork pull requests get a read-only
      # token and degrade to pull-only on their own.
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        if: runner.environment == 'github-hosted'
        with:
          # Perf/diagnostic telemetry to Determinate Systems is on by default.
          diagnostic-endpoint: ""
          # This isn't a FlakeHub flake; without this the action logs its own
          # FlakeHub-login-failure annotation on top of determinate-nixd's.
          use-flakehub: false

      - name: nix flake check
        shell: bash # -o pipefail, through the tee
        run: nix flake check -L 2>&1 | tee "$RUNNER_TEMP/nix.log"

      # The scaffolder is what `nix run github:Avunu/odoo-nix` executes; build it
      # from the same tree.
      - name: nix build
        shell: bash # -o pipefail, through the tee
        run: nix build .#default -L 2>&1 | tee -a "$RUNNER_TEMP/nix.log"

      - if: failure()
        uses: Avunu/python-devops-nix/.github/actions/nix-failures@ef790559b046095880b2776ebe6a00f455a455eb # python-devops-nix v1.4.0
        with:
          log: ${{ runner.temp }}/nix.log
          title: flake
          output: ${{ runner.temp }}/failures/flake.md

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failures-flake
          path: ${{ runner.temp }}/failures/flake.md
          if-no-files-found: ignore

  # The three pins of python-devops-nix's standards-core (flake.lock, the standards-core
  # URL odoo-nix-tools declares, the actions' SHAs) name one commit, and that commit is
  # on python-devops-nix's main or a v* tag, so `uv tool install` of odoo-nix-tools never
  # resolves a commit that only lived on a pull request's branch (core DESIGN.md §10.3).
  # The flake's standards-core-pins check is the offline half; this adds the
  # reachability, which needs the network. Red while the pin is unreleased: today until
  # python-devops-nix#58 merges and is released as v1.3.0 (`nix run .#bump-base -- v1.3.0`).
  standards-core-pins:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","nixos"]') }}
    timeout-minutes: 15
    permissions:
      contents: read # the checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        if: runner.environment == 'github-hosted'
        with:
          determinate: false

      - name: The core's pins agree and are released
        shell: bash
        run: |
          set -uo pipefail
          url=https://github.com/Avunu/python-devops-nix
          nix run .#standards-core-pins -- --reachable "$url" | tee "$RUNNER_TEMP/pins.txt"
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ] && grep -q 'is on neither' "$RUNNER_TEMP/pins.txt"; then
            echo "::error::odoo-nix pins a python-devops-nix commit that is on neither its main nor a v* tag. Expected until the pull request carrying it merges and is released (today python-devops-nix#58, v1.3.0); then move every pin with \`nix run .#bump-base -- <tag>\`."
          fi
          exit "$rc"

  report:
    needs: [lint, flake, standards-core-pins]
    # `!cancelled()`: a run a newer push superseded has nothing to say. A fork's pull
    # request gets a read-only token, so no comment. A dispatched run (release.yml's,
    # autofix.yml's) finds its pull request by branch.
    if: >-
      !cancelled() && (github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ fromJSON('["self-hosted","nixos"]') }}
    timeout-minutes: 5
    permissions:
      pull-requests: write # the comment
    steps:
      - uses: Avunu/python-devops-nix/.github/actions/check-report@ef790559b046095880b2776ebe6a00f455a455eb # python-devops-nix v1.4.0
        with:
          needs: ${{ toJSON(needs) }}
