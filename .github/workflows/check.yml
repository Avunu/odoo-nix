name: check

# Everything this repo asserts about itself: `flake` through the flake, so that CI and
# a laptop measure the same tree, and `lint`, every prek hook with no nix. This is what
# you mark required on `main`: auto-merge (Dependabot PRs) is only as safe as what runs here.
#
#   addons-*, odoo-conf-*        pure tests of lib/addons.nix + lib/odoo-conf.nix
#   lock-fresh-<18|19|20>        tests/fixtures/<series>/uv.lock matches the pinned OCB
#   built-odoo-<18|19|20>        a real Odoo assembled from the pin with the consumer code path
#   odoo-init-<18|19|20>         `-i base` against an in-sandbox PostgreSQL
#   odoo-test-<18|19|20>         the fixture addon's Odoo tests (incl. the devguard mail guard)
#   nginx                        the NixOS module's nginx/socket contract (stub Odoo, KVM)
#   service-<18|19|20>           the NixOS module bringing up the real Odoo (KVM)
#
# OCB is pinned (inputs.ocb-18 / ocb-19 / ocb-20, flake = false). Nothing drifts except when
# flake.lock changes, and dependabot's weekly nix update is what proposes that -- as a
# pull request that runs these checks. So there is no `schedule:` here; its absence is
# the point. release.yml dispatches this on the release pull request, whose
# GITHUB_TOKEN push raises no event.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  # Every hook in .pre-commit-config.yaml over the whole tree, run by prek: the command
  # a developer's commit runs, with no nix involved.
  lint:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","nixos"]') }}
    permissions:
      contents: read # the checkout
    steps:
      # A self-hosted runner reuses $RUNNER_TEMP, and its own cleanup leaves what an earlier
      # job made read-only (copies out of the Nix store): clear it, keeping the runner's _* files.
      - if: runner.environment != 'github-hosted'
        name: Clear what an earlier job left in the runner's temp dir
        working-directory: ${{ runner.temp }}
        run: |
          find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 ! -name '_*' ! -type l -exec chmod -R u+w {} +
          find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 ! -name '_*' -exec rm -rf {} +

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `prek run --all-files --show-diff-on-failure`: a hook that rewrites a file fails the
      # job, so what merges is what the hooks would have left.
      - uses: j178/prek-action@1382ad72dea72f9d53832f2bcb65b3e87a947204 # v3.0.1

  flake:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","nixos"]') }}
    permissions:
      contents: read # the checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `determinate: false` -- this flake carries no Determinate-only nixConfig
      # (FlakeHub substituters, lazy trees), so the default buys nothing here and
      # just has determinate-nixd try to log into FlakeHub for a repo that isn't
      # registered there, logging a failure annotation on every run. `kvm` stays
      # at its default (on): the installer adds the udev rule so the daemon
      # advertises the `kvm` system feature the VM tests need.
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        if: runner.environment == 'github-hosted'
        with:
          determinate: false

      # Backs /nix/store with the GitHub Actions cache. cache.nixos.org serves the
      # nixpkgs half of the closure; what it cannot serve is what this run builds
      # itself -- the `odoo` wheels, the PyPI wheel unpacks, psycopg2/python-ldap
      # from sdist, the VM test closures -- and those are what this recovers
      # between runs (~1 GB compressed, well under the 10 GB cap). Fetched flake
      # inputs (the OCB tarballs) are not uploaded; GitHub serves them fast
      # enough, so `diff-store` stays off. Fork pull requests get a read-only
      # token and degrade to pull-only on their own.
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        if: runner.environment == 'github-hosted'
        with:
          # Perf/diagnostic telemetry to Determinate Systems is on by default.
          diagnostic-endpoint: ""
          # This isn't a FlakeHub flake; without this the action logs its own
          # FlakeHub-login-failure annotation on top of determinate-nixd's.
          use-flakehub: false

      - name: nix flake check
        run: nix flake check -L

      # The scaffolder is what `nix run github:Avunu/odoo-nix` executes; build it
      # from the same tree.
      - name: nix build
        run: nix build .#default -L
