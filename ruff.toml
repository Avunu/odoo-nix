# Ruff's defaults, with one floor. Python in this repository loads into every
# interpreter either product's presets name (3.11 to 3.14 today), so nothing
# newer than 3.11 may be used: no PEP 695 syntax, itertools.batched or
# typing.override. Raise this in the pull request that retires the oldest
# preset (python-devops-nix docs/library.md, Python versions).
target-version = "py311"

# Odoo's own idioms: a manifest is a bare dict literal, and an addon's
# __init__.py imports its submodules so that Odoo loads them.
[lint.per-file-ignores]
"__manifest__.py" = ["B018"]
"tests/fixtures/**/__init__.py" = ["F401"]
