# odoo-nix's own test fixture: the smallest consumer-shaped workspace that
# builds a real Odoo 19.0 -- OCB `odoo` from the `ocb-19` flake input plus
# one custom addon (custom/odoo_nix_fixture). No OCA repos, no modules.txt.
#
# Hand-written, NOT managed by lib/oca_sources.py: the custom addon is a plain
# addons_path module, not a whool package, so it must not become a uv source.
# uv.lock is regenerated by `nix run .#relock`, which links ./odoo to the pinned
# OCB for the duration of `uv lock` (the link is gitignored; the Nix build gets
# OCB through lib/python.nix `coreSource` instead).
[project]
name = "odoo-nix-fixture-19"
version = "0.1.0"
description = "odoo-nix test fixture for Odoo 19.0"
requires-python = ">=3.12"
dependencies = ["odoo"]

[dependency-groups]
# What odoo.tests needs beyond OCB's install_requires (its tests_require, which
# uv does not install). Lands in testPythonEnv, never in builtOdoo.
dev = [
    "freezegun",
    "websocket-client",
]

[tool.uv]
# Virtual root: no Python code of its own.
package = false

[tool.uv.sources]
# OCB as a non-editable path source -- the shape lib/oca_sources.py emits.
odoo = { path = "odoo" }

# Legacy sdist-only deps that don't declare setuptools. Maintained by
# lib/uv_build_deps.py through `nix run .#relock`.
[tool.uv.extra-build-dependencies]
# >>> odoo-nix: sdist build deps (managed) >>>
"docopt" = ["setuptools"]
"odoo" = ["setuptools"]
"ofxparse" = ["setuptools"]
"python-ldap" = ["setuptools"]
"rjsmin" = ["setuptools"]
"vobject" = ["setuptools"]
# <<< odoo-nix: sdist build deps (managed) <<<
