# Mirror develop to the series branch (the addon repositories' stopgap release flow).
name: mirror

on:
  push:
    branches: [develop]

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          persist-credentials: true
      - run: git push origin "HEAD:refs/heads/$(cat .odoo-series)"
