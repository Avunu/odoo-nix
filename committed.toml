# odoo-nix's commit rules, checked by `committed` in the pr-policy workflow
# (.github/workflows/pr-policy.yml, lib/pr_policy.py; docs/reference/layout.md, "What CI runs").
# Conventional commits: `fix:` makes a patch release, `feat:` a minor one. The
# pr-policy check refuses `!` and BREAKING CHANGE: a major release is a
# deliberate `Release-As: <N>.0.0` footer.
style = "conventional"
allowed_types = [
  "build",
  "chore",
  "ci",
  "docs",
  "feat",
  "fix",
  "perf",
  "refactor",
  "revert",
  "style",
  "test",
  "deprecate",
]
# A scope is optional; when there is one it names a part of odoo-nix. `deps` is
# Dependabot's and `main` is release-please's (`chore(main): release X.Y.Z`).
allowed_scopes = [
  "addons",
  "backups",
  "banner",
  "ci",
  "cli",
  "containers",
  "deps",
  "dev_mailcatch",
  "devenv",
  "devguard",
  "docs",
  "init",
  "journald",
  "lock",
  "mailpit",
  "main",
  "module",
  "nixos",
  "oca_sources",
  "odoo-ls",
  "ports",
  "python",
  "release",
  "restore",
  "scaffold",
  "secrets",
  "shell",
  "submodules",
  "tests",
  "tooling",
]
subject_length = 100
line_length = 0
subject_capitalized = false
subject_not_punctuated = true
imperative_subject = false
no_wip = true
no_fixup = true
merge_commit = false
